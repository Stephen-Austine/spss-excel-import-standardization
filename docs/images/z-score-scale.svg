<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title description">
  <title id="title">Conceptual z-score scale</title>
  <desc id="description">A number line shows z-scores from minus two to plus two standard deviations, centred at zero, the mean.</desc>
  <rect width="900" height="270" rx="22" fill="#f8fafc"/>
  <text x="56" y="52" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">How to read a z-score</text>
  <text x="56" y="82" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15">Distance from the mean, measured in standard deviations</text>
  <line x1="160" y1="164" x2="800" y2="164" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="160" y1="148" x2="160" y2="180"/>
    <line x1="320" y1="148" x2="320" y2="180"/>
    <line x1="480" y1="112" x2="480" y2="194" stroke="#2563eb" stroke-width="3"/>
    <line x1="640" y1="148" x2="640" y2="180"/>
    <line x1="800" y1="148" x2="800" y2="180"/>
  </g>
  <line x1="480" y1="110" x2="480" y2="94" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="110" text-anchor="middle" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">mean</text>
  <g fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle">
    <text x="160" y="207">−2</text>
    <text x="320" y="207">−1</text>
    <text x="480" y="207" fill="#1d4ed8" font-weight="700">0</text>
    <text x="640" y="207">+1</text>
    <text x="800" y="207">+2</text>
  </g>
  <text x="56" y="244" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Below the mean</text>
  <text x="844" y="244" text-anchor="end" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Above the mean</text>
</svg>
