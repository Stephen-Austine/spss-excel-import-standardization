<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title description">
  <title id="title">Example data workflow</title>
  <desc id="description">An Excel sheet is imported into SPSS, height and weight are standardised, and the saved SPSS file is inspected with a Python utility.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1120" height="300" rx="24" fill="url(#background)"/>
  <text x="56" y="54" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">From spreadsheet to inspected SPSS data</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(56 94)">
      <rect width="210" height="142" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="34" cy="34" r="20" fill="#dcfce7"/>
      <text x="34" y="41" text-anchor="middle" fill="#15803d" font-size="20" font-weight="700">1</text>
      <text x="28" y="82" fill="#0f172a" font-size="18" font-weight="700">Excel sheet</text>
      <text x="28" y="108" fill="#475569" font-size="14">Source spreadsheet</text>
      <text x="28" y="128" fill="#475569" font-size="14">not included here</text>
    </g>
    <path d="M280 165h48" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(342 94)">
      <rect width="210" height="142" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="34" cy="34" r="20" fill="#dbeafe"/>
      <text x="34" y="41" text-anchor="middle" fill="#1d4ed8" font-size="20" font-weight="700">2</text>
      <text x="28" y="82" fill="#0f172a" font-size="18" font-weight="700">Import in SPSS</text>
      <text x="28" y="108" fill="#475569" font-size="14">Review inferred types</text>
      <text x="28" y="128" fill="#475569" font-size="14">and missing values</text>
    </g>
    <path d="M566 165h48" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(628 94)">
      <rect width="210" height="142" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="34" cy="34" r="20" fill="#ede9fe"/>
      <text x="34" y="41" text-anchor="middle" fill="#6d28d9" font-size="20" font-weight="700">3</text>
      <text x="28" y="82" fill="#0f172a" font-size="18" font-weight="700">Standardise</text>
      <text x="28" y="108" fill="#475569" font-size="14">Save height and weight</text>
      <text x="28" y="128" fill="#475569" font-size="14">z-scores in SPSS</text>
    </g>
    <path d="M852 165h48" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(914 94)">
      <rect width="150" height="142" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
      <circle cx="34" cy="34" r="20" fill="#cffafe"/>
      <text x="34" y="41" text-anchor="middle" fill="#0e7490" font-size="20" font-weight="700">4</text>
      <text x="24" y="82" fill="#0f172a" font-size="18" font-weight="700">Inspect</text>
      <text x="24" y="108" fill="#475569" font-size="14">Python report</text>
      <text x="24" y="128" fill="#475569" font-size="14">and tests</text>
    </g>
  </g>
</svg>
